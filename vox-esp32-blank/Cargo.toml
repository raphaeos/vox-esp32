[package]
name = "vox-esp32-blank"
version = "0.1.0"
authors = ["Raph <iam@raphaeos.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "vox-esp32-blank"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = 2     # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'

[dependencies]
log.workspace = true
anyhow.workspace = true
esp-idf-svc.workspace = true
esp-idf-hal.workspace = true
embassy-time.workspace = true

vox-esp32-core.workspace = true